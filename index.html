<title>Rain</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0d1117; color: #c9d1d9; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  main { max-width: 600px; padding: 2rem; text-align: center; }
  h1 { font-size: 2.5rem; margin-bottom: 0.5rem; color: #58a6ff; }

  .cards { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
  .card { background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 1.25rem; width: 180px; text-decoration: none; color: #c9d1d9; transition: border-color 0.2s, transform 0.2s; }
  .card:hover { border-color: #58a6ff; transform: translateY(-2px); }
  .card .icon { font-size: 1.5rem; margin-bottom: 0.5rem; }
  .card .name { font-weight: 600; color: #58a6ff; margin-bottom: 0.25rem; }
  .card .desc { font-size: 0.78rem; color: #8b949e; }
  .links { display: flex; flex-direction: column; gap: 0.75rem; }
  .links a { color: #58a6ff; text-decoration: none; padding: 0.75rem 1.5rem; border: 1px solid #30363d; border-radius: 6px; transition: background 0.2s; }
  .links a:hover { background: #161b22; }
  footer { margin-top: 3rem; color: #484f58; font-size: 0.85rem; }
</style>
</head>
